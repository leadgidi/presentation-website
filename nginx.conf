server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the Dokploy proxy an absolute redirect would leak the container port into the Location header.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/xml application/xml;
    gzip_min_length 1024;

    # nginx drops server-level add_header in any location that sets its own, so each location lists them all.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Next exports the Open Graph image without an extension; crawlers need the real type.
    location = /opengraph-image {
        default_type image/png;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    # Match $request_uri, not $uri, so the index directive's internal redirect does not loop.
    if ($request_uri ~ ^([^?]*/)index\.html) {
        return 301 $1;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
    }

    error_page 404 /404.html;
}
